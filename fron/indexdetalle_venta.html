<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de Venta</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
    <main class="card">
        <header class="card-header">
            <h1>Detalle de la Venta</h1>
        </header>
        <div class="card-body">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID Producto</th>
                            <th>Nombre</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- JavaScript inyectará las filas aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="./componentes/detalle_venta.js"></script>
    
</body>
</html>
